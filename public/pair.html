<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 FREEZER MD 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg1:#010817;
    --bg2:#03152e;
    --accent:#00aaff;
    --accent2:#087bff;
    --soft:#69e8ff;
    --danger:#ff667c;
    --success:#00ffad;
    --glass:rgba(2,15,36,0.91);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
    background:#010817;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(ellipse at 50% 0%,rgba(0,120,255,.22),transparent 50%),
        radial-gradient(ellipse at 0% 100%,rgba(0,160,255,.16),transparent 45%),
        radial-gradient(ellipse at 100% 80%,rgba(0,100,255,.15),transparent 45%),
        linear-gradient(145deg,#010611,#03152e 48%,#010817);
    color:#eaf8ff;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    isolation:isolate;
}

/* Frozen particles */
body::before,
body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:-1;
}

body::before{
    inset:0;
    background-image:
        radial-gradient(circle,rgba(86,195,255,.9) 1px,transparent 2px),
        radial-gradient(circle,rgba(0,115,255,.75) 2px,transparent 4px),
        radial-gradient(circle,rgba(165,230,255,.65) 1px,transparent 3px);
    background-size:73px 91px,127px 139px,181px 167px;
    background-position:0 0,34px 51px,90px 20px;
    opacity:.48;
}

body::after{
    inset:0;
    background:
        linear-gradient(180deg,transparent 60%,rgba(0,100,255,.08)),
        radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.48) 100%);
}

.card{
    width:92%;
    max-width:470px;
    background:
        linear-gradient(145deg,rgba(2,20,46,.96),rgba(0,9,25,.97));
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:30px;
    padding:30px 23px 25px;
    box-shadow:
        0 0 0 1px rgba(40,175,255,.3),
        0 0 12px rgba(0,145,255,.32),
        0 0 40px rgba(0,95,255,.2),
        inset 0 1px 0 rgba(177,235,255,.35),
        inset 0 0 35px rgba(0,115,255,.06);
    text-align:center;
    border:1px solid rgba(76,190,255,.85);
    position:relative;
    overflow:hidden;
}

/* Icy highlights */
.card::before{
    content:"";
    position:absolute;
    top:0;
    left:8%;
    width:84%;
    height:2px;
    background:linear-gradient(90deg,transparent,#8ceaff,#fff,#36baff,transparent);
    box-shadow:0 0 14px #19aaff;
    opacity:.95;
}

.card::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:170px;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(0,128,255,.09),transparent);
}

h1{
    position:relative;
    z-index:1;
    font-size:clamp(1.65rem,7vw,2.35rem);
    font-weight:700;
    font-style:italic;
    letter-spacing:-1.4px;
    margin-bottom:8px;
    background:linear-gradient(180deg,#fff 5%,#a5efff 45%,#138dff 85%,#0064d9);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 9px rgba(0,160,255,.55));
}

.status{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:.78rem;
    letter-spacing:.4px;
    color:#70dfff;
    margin-bottom:27px;
    padding:10px 18px;
    border:1px solid rgba(0,170,255,.8);
    border-radius:40px;
    background:rgba(0,65,125,.23);
    box-shadow:
        0 0 14px rgba(0,130,255,.18),
        inset 0 0 12px rgba(0,145,255,.08);
}

.status::before{
    content:"";
    width:10px;
    height:10px;
    flex-shrink:0;
    border-radius:50%;
    background:#00ffae;
    box-shadow:0 0 9px #00ffae,0 0 18px rgba(0,255,174,.55);
}

.input-wrap{
    position:relative;
    background:linear-gradient(135deg,#20cfff,#087aff,#74eaff);
    border-radius:19px;
    padding:2px;
    margin-bottom:18px;
    box-shadow:
        0 0 15px rgba(0,145,255,.2),
        inset 0 0 8px rgba(255,255,255,.2);
    transition:.25s;
}

.input-wrap:focus-within{
    box-shadow:
        0 0 0 2px rgba(73,208,255,.14),
        0 0 25px rgba(0,157,255,.4);
}

input{
    width:100%;
    min-width:0;
    border:none;
    outline:none;
    padding:17px 15px;
    border-radius:17px;
    background:rgba(1,12,31,.98);
    color:#e9faff;
    text-align:left;
    font-size:1rem;
    font-family:'Poppins',sans-serif;
    font-weight:500;
    letter-spacing:.5px;
    caret-color:#35d5ff;
}

input::placeholder{
    color:#7195c9;
    opacity:.85;
}

button{
    position:relative;
    width:100%;
    border:1px solid rgba(157,245,255,.95);
    border-radius:20px;
    padding:17px 12px;
    font-family:'Poppins',sans-serif;
    font-size:clamp(.88rem,3.8vw,1.05rem);
    font-weight:700;
    letter-spacing:.35px;
    cursor:pointer;
    overflow:hidden;
    background:
        linear-gradient(110deg,#8bf4ff 0%,#21cfff 25%,#078bff 65%,#63e5ff 100%);
    color:#00132e;
    box-shadow:
        0 0 0 1px rgba(66,194,255,.45),
        0 0 17px rgba(0,151,255,.55),
        0 0 35px rgba(0,101,255,.23),
        inset 0 2px 2px rgba(255,255,255,.8),
        inset 0 -3px 8px rgba(0,70,200,.25);
    transition:transform .25s,box-shadow .25s,filter .25s;
}

button::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.42),transparent 35%,transparent 65%,rgba(255,255,255,.2));
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
    box-shadow:
        0 0 22px rgba(0,190,255,.7),
        0 0 42px rgba(0,100,255,.35),
        inset 0 2px 3px rgba(255,255,255,.8);
}

button:active{
    transform:scale(.985);
}

#result{
    margin-top:22px;
    min-height:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    overflow-wrap:anywhere;
}

.code-display{
    max-width:100%;
    padding:12px 20px;
    border-radius:14px;
    border:1px solid #42ddff;
    background:linear-gradient(135deg,rgba(0,133,255,.15),rgba(0,25,65,.75));
    color:#7beaff;
    font-weight:700;
    letter-spacing:4px;
    cursor:pointer;
    transition:.2s;
    position:relative;
    box-shadow:
        0 0 15px rgba(0,175,255,.15),
        inset 0 0 15px rgba(0,120,255,.08);
    overflow-wrap:anywhere;
}

.code-display:hover{
    background:rgba(0,145,255,.2);
    box-shadow:0 0 20px rgba(0,180,255,.3);
}

.code-display::after{
    content:"TAP TO COPY";
    display:block;
    font-size:.65rem;
    opacity:.7;
    margin-top:7px;
    letter-spacing:1.5px;
}

.loader{
    width:32px;
    height:32px;
    border:3px solid rgba(71,183,255,.2);
    border-top:3px solid #50e5ff;
    border-right:3px solid #168dff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    box-shadow:0 0 13px rgba(0,170,255,.2);
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* Dynamic bot features */
#notices{
    position:relative;
    margin-top:25px!important;
    padding:19px 15px;
    border:1px solid rgba(27,146,255,.65);
    border-radius:22px;
    background:linear-gradient(145deg,rgba(0,43,88,.36),rgba(0,12,34,.7));
    box-shadow:
        inset 0 0 20px rgba(0,116,255,.05),
        0 0 12px rgba(0,110,255,.08);
    color:#d8edff;
    line-height:1.65!important;
}

#notices b{
    display:block;
    color:#76dfff;
    font-size:.83rem;
    margin-bottom:12px;
}

#noticeList{
    padding-left:20px!important;
    margin-top:8px!important;
}

#noticeList li{
    padding:5px 0 5px 3px;
    color:#c5dcff;
    font-size:.76rem;
}

#noticeList li::marker{
    color:#1bbcff;
}

footer{
    margin-top:24px;
    padding-top:17px;
    position:relative;
    font-size:.68rem;
    color:#46d9ff;
    letter-spacing:1px;
    text-shadow:0 0 10px rgba(0,160,255,.4);
}

footer::before{
    content:"";
    display:block;
    width:65%;
    height:1px;
    margin:0 auto 15px;
    background:linear-gradient(90deg,transparent,#078dff,#67eaff,#078dff,transparent);
    box-shadow:0 0 8px rgba(0,157,255,.4);
}

@media(max-width:480px){
    body{
        padding:18px 0;
        align-items:flex-start;
    }

    .card{
        width:92%;
        padding:27px 18px 22px;
        border-radius:25px;
    }

    h1{
        letter-spacing:-1px;
    }

    .status{
        margin-bottom:23px;
    }

    input{
        padding:16px 13px;
        font-size:.95rem;
    }

    button{
        padding:16px 9px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>FREEZER MD</h1>
    <div class="status">👑 SYSTEM IS ACTIVE 👑</div>

    <div class="input-wrap">
        <input
            type="text"
            id="number"
            placeholder="+923078071982"
            autocomplete="off"
        >
    </div>

    <button onclick="getCode()">✨ GET CODE ✨</button>

    <div id="result"></div>

    <div id="notices" style="display:none;margin-top:16px;text-align:left;font-size:.75rem;opacity:.8;line-height:1.5">
        <b>By linking, this bot will (you can change these settings later):</b>
        <ul id="noticeList" style="margin:6px 0 0;padding-left:18px"></ul>
    </div>

    <footer>⚠️ FREEZER MD WHATSAPP BOT ⚠️</footer>
</div>

<script>
async function getCode() {
    const numberInput = document.getElementById("number");
    const resDiv = document.getElementById("result");
    const num = numberInput.value.replace(/[^0-9]/g, '');

    if (!num) {
        playSound('error');
        resDiv.innerHTML = "<span style='color:var(--danger)'>Please enter a number 😊</span>";
        return;
    }

    resDiv.innerHTML = '<div class="loader"></div><span style="font-size:.8rem;opacity:.7">Connecting... 😃</span>';

    try {
        const req = await fetch(`/code?number=${num}`);
        const data = await req.json();

        if (data.code) {
            resDiv.innerHTML = `
                <div style="font-size:.75rem;opacity:.7">PAIRING CODE</div>
                <div class="code-display" onclick="copyCode('${data.code}')">${data.code}</div>
            `;
            playSound('success');
        } else if (data.status === 'already_connected') {
            resDiv.innerHTML = "<span style='color:var(--success)'>A mini bot is already connected to this number 🥺 Please enter another number 🙂</span>";
        } else if (data.status === 'reconnecting') {
            resDiv.innerHTML = "<span style='color:var(--success)'>This number is already linked and is reconnecting. Please wait a minute 🙂</span>";
        } else {
            const why = data.details || data.error;
            resDiv.innerHTML = "<span style='color:var(--danger)'>[ERROR] CONNECTION FAILED</span>" + (why ? "<div style='font-size:.7rem;opacity:.7;margin-top:6px'></div>" : "");
            if (why) resDiv.querySelector('div').textContent = why;
        }
    } catch (e) {
        resDiv.innerHTML = "<span style='color:var(--danger)'>[CRITICAL] SERVER UNREACHABLE</span>";
    }
}

(async () => {
    try {
        const r = await (await fetch('/info')).json();
        if (!r.items || !r.items.length) return;
        const ul = document.getElementById('noticeList');
        r.items.forEach(it => {
            const li = document.createElement('li');
            li.textContent = it.text;
            ul.appendChild(li);
        });
        document.getElementById('notices').style.display = 'block';
    } catch (e) {}
})();

function copyCode(code) {
    navigator.clipboard.writeText(code);
    const display = document.querySelector('.code-display');
    const originalText = display.innerText;

    display.innerText = "COPIED 😊";
    display.style.borderColor = "var(--success)";
    display.style.color = "var(--success)";

    setTimeout(() => {
        display.innerText = originalText;
        display.style.borderColor = "var(--soft)";
        display.style.color = "var(--soft)";
    }, 1500);
}

// Optional: Simple placeholder sound function
function playSound(type) {
    // You can add real sounds here later if you want
}
</script>

</body>
</html>
